# Alembic configuration for ModelMatch backend.
#
# Migrations are run as a SEPARATE step (a Job / Helm hook in the cluster, or
# `uv run alembic upgrade head` in dev/CI) — NEVER on app startup (see app/db.py).
# The database URL is NOT hardcoded here: migrations/env.py reads DATABASE_URL
# from app.config (pydantic-settings), so dev/CI/cluster all use one source.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revision filenames are date-prefixed for a readable, ordered history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
