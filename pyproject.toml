[project]
name = "modelmatch-backend"
version = "0.0.1"
description = "ModelMatch backend — deterministic recommender, CI savings engine, in-cluster LLM (ingestion + chat), and the CI agent image."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "sqlglot>=25.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# In-cluster backend surface (ingestion #3 + chat #4) talks to Bedrock Nova via IRSA
# ONLY (the two-surface rule), so its runtime image needs JUST boto3 — never the BYOK
# anthropic/gemini SDKs. The backend image is built with `uv sync --extra bedrock`.
bedrock = [
    "boto3>=1.35",
]
# Full BYOK provider set — installed in the AGENT image (uv sync --extra llm), which is
# provider-agnostic (Anthropic/Gemini/Bedrock). Superset of `bedrock`. NOT needed for
# the core API or the offline fake-client tests.
llm = [
    "anthropic>=0.39",
    "google-genai>=1.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
