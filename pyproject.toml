[project]
name = "modelmatch-backend"
version = "0.0.1"
description = "ModelMatch backend — deterministic recommender, CI savings engine, in-cluster LLM (ingestion + chat), and the CI agent image."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
