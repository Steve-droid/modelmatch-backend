[project]
name = "modelmatch-backend"
version = "0.0.1"
description = "Modicum backend — deterministic recommender, CI savings engine, in-cluster LLM (ingestion + chat), and the CI agent image."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Floor starlette past CVE-2026-54282/54283 (fastapi pulls it transitively). Keeps
    # the pip-audit gate green — remediate-not-waive.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "sqlglot>=25.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# In-cluster backend surface (ingestion #3 + chat #4) talks to Bedrock Nova via IRSA
# ONLY (the two-surface rule), so its runtime image needs JUST boto3 — never the BYOK
# anthropic/gemini SDKs. The backend image is built with `uv sync --extra bedrock`.
bedrock = [
    "boto3>=1.35",
]
# Full BYOK provider set — installed in the AGENT image (uv sync --extra llm), which is
# provider-agnostic (Anthropic/Gemini/Bedrock). Superset of `bedrock`. NOT needed for
# the core API or the offline fake-client tests.
llm = [
    "anthropic>=0.39",
    "google-genai>=1.0",
    "boto3>=1.35",
    # Floor cryptography past GHSA-537c-gmf6-5ccf (48.0.0, bundled OpenSSL) and
    # CVE-2026-69247 (49.0.0, PKCS#7) — Trivy gate on the agent image, 2026-09-08. Pulled transitively by google-genai (-> google-auth). Only the
    # agent image (--extra llm) ships it; keeps the agent pip-audit + Trivy gates green —
    # remediate-not-waive. (The backend --extra bedrock set never pulls cryptography.)
    "cryptography>=50.0.0",
    # Floor pyasn1 past CVE-2026-59884/59885/59886 (BER/ASN.1 DoS). Pulled transitively
    # by google-genai (-> google-auth -> rsa). Same remediate-not-waive rule; agent-only.
    "pyasn1>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    # Only the offline catalog-ingest tool (`python -m app.catalog.ingest_realvuln`)
    # parses YAML — it reads RealVuln's own price table. Dev-only on purpose: the
    # runtime API image must not grow a dependency for an operator script, so the
    # import is lazy and fails with a clear message if the tool runs without it.
    "pyyaml>=6.0",
    # Static/dep security gate run by the CI pipeline (P18) — dev-only, never shipped
    # in the runtime image. Bandit = Python SAST; pip-audit = dependency CVE audit.
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: an unregistered @pytest.mark.* is an error, so the integration
# marker can't silently rot. The conftest auto-marks every DB-backed test (any test
# pulling the migrated_engine/db_session/client fixtures) as `integration`, so the CI
# fast lane runs `-m "not integration"` (no containers) and the full lane runs
# `-m integration` against a compose Postgres.
addopts = "--strict-markers"
markers = [
    "integration: DB-backed — needs a real Postgres (compose). Auto-applied to any test using the DB fixtures; deselected in the fast/unit lane.",
]

[tool.bandit]
# The pipeline targets `app` and `agent` explicitly; this keeps an ad-hoc `bandit -r .`
# from scanning tests/fixtures. Gate thresholds (severity/confidence) are passed as CLI
# flags in the Jenkinsfile, not pinned here, so they stay visible at the gate.
exclude_dirs = ["tests", ".venv", "migrations"]
